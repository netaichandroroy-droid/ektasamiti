name: Build Android APK & Publish Release

on:
  push:
    tags-ignore:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json if secret configured
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f app/google-services.json ]; then
            trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed '1s/^\xEF\xBB\xBF//' | awk 'BEGIN{RS="";ORS=""} {gsub(/^[[:space:]]+|[[:space:]]+$/,""); print}')"
            case "$trimmed" in
              \{*)
                printf '%s\n' "$trimmed" > app/google-services.json
                ;;
              *)
                printf '%s' "$trimmed" | tr -d '\n\r ' | base64 -d > app/google-services.json
                ;;
            esac
            echo "::notice::Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json missing — Google Sign-In and Cloud Sync will be disabled in this APK until GOOGLE_SERVICES_JSON secret is added."
          fi

      - name: Compute monotonic release version
        id: ver
        run: |
          EPOCH_NOW=$(date -u +%s)
          MONOTONIC_CODE=$(( (EPOCH_NOW - 1704067200) / 10 ))
          if [ "$MONOTONIC_CODE" -lt 100 ]; then
            MONOTONIC_CODE=100
          fi
          RUN_NUM=${{ github.run_number }}
          if [ "$RUN_NUM" -gt "$MONOTONIC_CODE" ]; then
            MONOTONIC_CODE="$RUN_NUM"
          fi
          MAX_TAG=$(git ls-remote --tags origin 'refs/tags/v1.0.*' 2>/dev/null \
            | sed -n 's/.*refs\/tags\/v1\.0\.\([0-9][0-9]*\).*/\1/p' \
            | sort -n | tail -n 1)
          if [ -n "$MAX_TAG" ] && [ "$MAX_TAG" -ge "$MONOTONIC_CODE" ]; then
            MONOTONIC_CODE=$(( MAX_TAG + 1 ))
          fi
          echo "code=$MONOTONIC_CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$MONOTONIC_CODE" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        env:
          APP_VERSION_NAME: "${{ steps.ver.outputs.name }}"
        run: gradle :app:assembleDebug --no-daemon -PappVersionCode=${{ steps.ver.outputs.code }} -PappVersionName="${{ steps.ver.outputs.name }}" -PgithubRepo="${{ github.repository }}"

      - name: Prepare Permanent and Versioned APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "EktaSamiti.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "EktaSamiti-v${{ steps.ver.outputs.name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EktaSamiti-APK
          path: |
            EktaSamiti.apk
            EktaSamiti-v${{ steps.ver.outputs.name }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.name }}"
          name: "Ekta Samiti v${{ steps.ver.outputs.name }}"
          body: |
            Automated APK build from push (${{ github.sha }}). Version Code: ${{ steps.ver.outputs.code }}.
            Permanent Direct APK Link (never changes): https://github.com/${{ github.repository }}/releases/latest/download/EktaSamiti.apk
          files: |
            EktaSamiti.apk
            EktaSamiti-v${{ steps.ver.outputs.name }}.apk
          make_latest: true
