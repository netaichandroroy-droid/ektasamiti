name: Build Android APK & Publish Release

on:
  push:
    tags-ignore:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json if secret configured
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f app/google-services.json ]; then
            trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed '1s/^\xEF\xBB\xBF//' | awk 'BEGIN{RS="";ORS=""} {gsub(/^[[:space:]]+|[[:space:]]+$/,""); print}')"
            case "$trimmed" in
              \{*)
                printf '%s\n' "$trimmed" > app/google-services.json
                ;;
              *)
                printf '%s' "$trimmed" | tr -d '\n\r ' | base64 -d > app/google-services.json
                ;;
            esac
            echo "::notice::Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json missing — Google Sign-In and Cloud Sync will be disabled in this APK until GOOGLE_SERVICES_JSON secret is added."
          fi

      - name: Build Debug APK
        env:
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle :app:assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName="1.0.${{ github.run_number }}" -PgithubRepo="${{ github.repository }}"

      - name: Prepare Versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "EktaSamiti-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EktaSamiti-APK
          path: "EktaSamiti-v1.0.${{ github.run_number }}.apk"
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Ekta Samiti v1.0.${{ github.run_number }}"
          body: "Automated APK build from push (${{ github.sha }}). Version Code: ${{ github.run_number }}."
          files: "EktaSamiti-v1.0.${{ github.run_number }}.apk"
          make_latest: true
