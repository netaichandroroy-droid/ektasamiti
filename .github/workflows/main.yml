name: Verify Android Build & Tests

on:
  push:
    tags-ignore:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Restore google-services.json if secret configured
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f app/google-services.json ]; then
            trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed '1s/^\xEF\xBB\xBF//' | awk 'BEGIN{RS="";ORS=""} {gsub(/^[[:space:]]+|[[:space:]]+$/,""); print}')"
            case "$trimmed" in
              \{*)
                printf '%s\n' "$trimmed" > app/google-services.json
                ;;
              *)
                printf '%s' "$trimmed" | tr -d '\n\r ' | base64 -d > app/google-services.json
                ;;
            esac
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.MembersScreenLayoutTest" --tests "com.example.NameWiseSubmitButtonsTest" --tests "com.example.WeeklyCollectionDateUpdateTest" --tests "com.example.DashboardScreenLayoutTest" --tests "com.example.GitHubUpdateCheckerTest" --tests "com.example.DataResetAdminAuthTest" --tests "com.example.StartupCrashResilienceTest" --tests "com.example.SessionPersistenceTest" --tests "com.example.ExampleRobolectricTest" --tests "com.example.DateUpdateTest" --tests "com.example.LoanReminderCalculatorTest" --tests "com.example.LoanScheduleCalculatorTest" --tests "com.example.WeeklyChartAggregatorTest" --tests "com.example.MemberHistoryAggregatorTest" --tests "com.example.MonthlySummaryCalculatorTest" --tests "com.example.SuccessPopupViewModelTest" --tests "com.example.GoogleSignInAccountTest" --tests "com.example.LoanSheetTest" --tests "com.example.NonMemberLoanTest" --tests "com.example.DateWiseCashLedgerTest" --no-daemon
